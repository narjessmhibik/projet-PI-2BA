<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Détecteur de Fleurs IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* ==========================================
           VARIABLES CSS POUR LES THÈMES
           ========================================== */
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text: #2c3e50;
            --text-light: #555;
            --card-bg: #ffffff;
            --nav-bg: rgba(255, 255, 255, 0.95);
            --stat-bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --feature-card: rgba(255,255,255,0.1);
        }

        /* Thème Nature 🌿 */
        [data-theme="nature"] {
            --primary: #10b981;
            --secondary: #059669;
            --accent: #34d399;
            --bg-gradient: linear-gradient(135deg, #0f766e 0%, #065f46 50%, #064e3b 100%);
        }

        /* Thème Océan 🌊 */
        [data-theme="ocean"] {
            --primary: #06b6d4;
            --secondary: #0891b2;
            --accent: #22d3ee;
            --bg-gradient: linear-gradient(135deg, #0ea5e9 0%, #0284c7 50%, #0369a1 100%);
        }

        /* Thème Sunset 🌅 */
        [data-theme="sunset"] {
            --primary: #f97316;
            --secondary: #ea580c;
            --accent: #fb923c;
            --bg-gradient: linear-gradient(135deg, #fbbf24 0%, #f59e0b 25%, #f97316 50%, #ec4899 100%);
        }

        /* Thème Sombre 🌙 */
        [data-theme="dark"] {
            --primary: #a78bfa;
            --secondary: #8b5cf6;
            --accent: #c084fc;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            --text: #ffffff;
            --text-light: #b0b0b0;
            --card-bg: #1e1b4b;
            --nav-bg: rgba(26, 26, 46, 0.95);
            --stat-bg: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            --feature-card: rgba(255,255,255,0.1);
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
            color: var(--text);
        }
        
        /* ==========================================
           SÉLECTEUR DE THÈMES
           ========================================== */
        .theme-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .theme-toggle-btn:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .theme-menu {
            position: absolute;
            top: 70px;
            right: 0;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            min-width: 280px;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .theme-menu.active {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-menu h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .theme-option {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: 600;
            color: var(--text);
        }

        .theme-option:hover {
            transform: translateX(5px);
            border-color: var(--primary);
        }

        .theme-option.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .theme-preview {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .theme-preview-default { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .theme-preview-nature { background: linear-gradient(135deg, #0f766e 0%, #065f46 100%); }
        .theme-preview-ocean { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); }
        .theme-preview-sunset { background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%); }
        .theme-preview-dark { background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); }
        
        .login-container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            animation: slideUp 0.5s ease;
            transition: all 0.3s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }
        
        h1 {
            text-align: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 40px;
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid var(--feature-card);
            border-radius: 15px;
            font-size: 1rem;
            transition: all 0.3s;
            background: var(--stat-bg);
            color: var(--text);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(var(--primary-rgb), 0.1);
        }
        
        input::placeholder {
            color: var(--text-light);
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(var(--primary-rgb), 0.3);
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(var(--primary-rgb), 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--feature-card);
        }
        
        .divider::before {
            left: 0;
        }
        
        .divider::after {
            right: 0;
        }
        
        .divider span {
            background: var(--card-bg);
            padding: 0 15px;
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .register-link {
            text-align: center;
            margin-top: 25px;
            color: var(--text-light);
        }
        
        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .register-link a:hover {
            color: var(--secondary);
            text-decoration: underline;
        }
        
        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .back-home:hover {
            gap: 12px;
        }
        
        .alert {
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
        
        .password-toggle {
            position: relative;
        }
        
        .password-toggle input {
            padding-right: 50px;
        }
        
        .toggle-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.3rem;
            user-select: none;
            color: var(--text-light);
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }
            
            h1 {
                font-size: 1.7rem;
            }
            
            .theme-selector { 
                top: 10px; 
                right: 10px; 
            }
            
            .theme-toggle-btn { 
                width: 50px; 
                height: 50px; 
                font-size: 1.5rem; 
            }
        }
    </style>
</head>
<body>
    <!-- Sélecteur de Thèmes -->
    <div class="theme-selector">
        <button class="theme-toggle-btn" onclick="toggleThemeMenu()" id="theme-btn">
            🎨
        </button>
        
        <div class="theme-menu" id="theme-menu">
            <h3>🎨 Choisir un thème</h3>
            
            <div class="theme-option" onclick="setTheme('default')" data-theme="default">
                <div class="theme-preview theme-preview-default">🎨</div>
                <span>Défaut</span>
            </div>
            
            <div class="theme-option" onclick="setTheme('nature')" data-theme="nature">
                <div class="theme-preview theme-preview-nature">🌿</div>
                <span>Nature</span>
            </div>
            
            <div class="theme-option" onclick="setTheme('ocean')" data-theme="ocean">
                <div class="theme-preview theme-preview-ocean">🌊</div>
                <span>Océan</span>
            </div>
            
            <div class="theme-option" onclick="setTheme('sunset')" data-theme="sunset">
                <div class="theme-preview theme-preview-sunset">🌅</div>
                <span>Sunset</span>
            </div>
            
            <div class="theme-option" onclick="setTheme('dark')" data-theme="dark">
                <div class="theme-preview theme-preview-dark">🌙</div>
                <span>Sombre</span>
            </div>
        </div>
    </div>

    <div class="login-container">
        <a href="{% url 'flower_detector:home' %}" class="back-home">
            ← Retour à l'accueil
        </a>
        
        <div class="logo">
            <div class="logo-icon">🌺</div>
        </div>
        
        <h1>Connexion</h1>
        <p class="subtitle">Accédez à votre compte</p>
        
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    autofocus
                    placeholder="Entrez votre nom d'utilisateur"
                >
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <div class="password-toggle">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        placeholder="Entrez votre mot de passe"
                    >
                    <span class="toggle-icon" onclick="togglePassword()">👁️</span>
                </div>
            </div>
            
            <button type="submit" class="btn-login">
                🔓 Se connecter
            </button>
        </form>
        
        <div class="divider">
            <span>OU</span>
        </div>
        
        <div class="register-link">
            Pas encore de compte ? 
            <a href="{% url 'flower_detector:register' %}">Créer un compte</a>
        </div>
    </div>
    
    <script>
        // ==========================================
        // GESTION DES THÈMES
        // ==========================================
        
        // Charger le thème au démarrage
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('userTheme') || 'default';
            applyTheme(savedTheme);
            
            // Initialiser les couleurs CSS personnalisées
            initializeThemeColors();
        });

        function toggleThemeMenu() {
            const menu = document.getElementById('theme-menu');
            menu.classList.toggle('active');
        }

        function setTheme(themeName) {
            applyTheme(themeName);
            localStorage.setItem('userTheme', themeName);
            document.getElementById('theme-menu').classList.remove('active');
            
            // Notification
            showNotification(`Thème "${getThemeName(themeName)}" activé ! 🎨`);
        }

        function applyTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            
            // Mettre à jour les options actives
            document.querySelectorAll('.theme-option').forEach(option => {
                option.classList.remove('active');
            });
            
            const activeOption = document.querySelector(`[data-theme="${themeName}"]`);
            if (activeOption) {
                activeOption.classList.add('active');
            }

            // Changer l'icône du bouton
            const icons = {
                'default': '🎨',
                'nature': '🌿',
                'ocean': '🌊',
                'sunset': '🌅',
                'dark': '🌙'
            };
            document.getElementById('theme-btn').textContent = icons[themeName] || '🎨';
        }

        function getThemeName(theme) {
            const names = {
                'default': 'Défaut',
                'nature': 'Nature',
                'ocean': 'Océan',
                'sunset': 'Coucher de Soleil',
                'dark': 'Sombre'
            };
            return names[theme] || 'Défaut';
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 90px;
                right: 20px;
                background: var(--primary);
                color: white;
                padding: 15px 25px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.3);
                z-index: 10000;
                font-weight: 600;
                animation: slideIn 0.3s ease;
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Initialiser les couleurs CSS personnalisées pour les thèmes
        function initializeThemeColors() {
            const style = document.createElement('style');
            style.textContent = `
                :root {
                    --primary-rgb: 99, 102, 241;
                    --secondary-rgb: 139, 92, 246;
                }
                
                [data-theme="nature"] {
                    --primary-rgb: 16, 185, 129;
                    --secondary-rgb: 5, 150, 105;
                }
                
                [data-theme="ocean"] {
                    --primary-rgb: 6, 182, 212;
                    --secondary-rgb: 8, 145, 178;
                }
                
                [data-theme="sunset"] {
                    --primary-rgb: 249, 115, 22;
                    --secondary-rgb: 234, 88, 12;
                }
                
                [data-theme="dark"] {
                    --primary-rgb: 167, 139, 250;
                    --secondary-rgb: 139, 92, 246;
                }
            `;
            document.head.appendChild(style);
        }

        // Fermer le menu si clic ailleurs
        document.addEventListener('click', function(event) {
            const selector = document.querySelector('.theme-selector');
            const menu = document.getElementById('theme-menu');
            
            if (!selector.contains(event.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
            }
        });

        // ==========================================
        // FONCTIONS SPÉCIFIQUES À LA PAGE
        // ==========================================
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }
        
        // Auto-hide messages après 5 secondes
        setTimeout(() => {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(alert => {
                alert.style.opacity = '0';
                alert.style.transform = 'translateY(-20px)';
                setTimeout(() => alert.remove(), 300);
            });
        }, 5000);

        // Animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { opacity: 0; transform: translateX(100px); }
                to { opacity: 1; transform: translateX(0); }
            }
            @keyframes slideOut {
                from { opacity: 1; transform: translateX(0); }
                to { opacity: 0; transform: translateX(100px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
